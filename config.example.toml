[dexscreener]
# De DexScreener se saca el par del token comprado (precio, liquidez, market
# cap, edad...) para los filtros, el aviso y el seguimiento del resultado.
chain_id = "solana"
# Monedas contra las que debe cotizar el par, por símbolo o dirección del
# quote (en Solana, casi todo cotiza contra SOL). Vacío = cualquiera.
quote_tokens = ["SOL"]
# dexId de DexScreener en los que debe estar el par (pumpswap, raydium,
# meteora, orca...). Si el token tiene varios pools, se usa el de más liquidez
# entre los que cumplen esto y quote_tokens. Vacío = cualquiera.
dex_ids = ["pumpswap", "raydium"]

[radar]
# Base SQLite donde se registra cada compra de las wallets seguidas (avisada o
# descartada, con su motivo) y su precio a +5, +15 y +30 min y a +1, +4 y +24 h. La usan la
# lista negra automática ([wallets].rug_drop_pct y loser_*) y los cooldowns
# tras un reinicio. Se crea sola. "" = no registrar.
alert_log_path = "alertas.db"
verbose = false

[solana]
# Antes de avisar, comprueba en la blockchain que el token no se pueda acuñar
# (mintAuthority) ni congelar (freezeAuthority). Si el RPC no responde, la
# señal sale igual y queda el aviso en el log.
check_token_authorities = true
rpc_url = "https://api.mainnet-beta.solana.com"

[wallets]
# Seguimiento de wallets: avisa cuando una de las del fichero compra un token.
# Usa el rpc_url de [solana]; el RPC público corta enseguida, conviene uno con
# API key (Helius, QuickNode...). Las compras en bonding curve (pump.fun antes
# de graduarse, etc.) se ignoran salvo con bonding_curve = true, y las de
# tokens que se pueden acuñar o congelar se descartan.
# Una dirección por línea; lo que va detrás de # es la etiqueta del aviso:
#   5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1  # ballena 1
# Hasta el 2026-11-07 un * detrás de la dirección la marcaba de confianza
# (avisaba sola y se saltaba el cambio 1h, el market cap, min_txns_m5 y el
# turnover). Ya no hace nada: todas pasan los mismos filtros. Desde el 17-oct
# eso dejaba pasar 45 avisos de 724, que daban +2% a 1 h y -2% a 24 h (todos,
# +1% y -8%); se quitó igual, por estrategia.
# Se relee solo cuando cambia: no hace falta reiniciar para añadir wallets.
file = "wallets.txt"
interval_seconds = 15
# SOL mínimo gastado para contar una transacción como compra (descarta
# airdrops de spam y transferencias). Pagar con USDC/USDT cuenta siempre.
min_sol = 0.1
# Minutos sin repetir aviso de la misma wallet en el mismo token: las que
# compran en varias tx seguidas y las que van promediando un token cada pocas
# horas. 2026-10-22: con 24 h se quitaban 83 de 146 avisos, que daban -21% de
# mediana a 24 h (los que quedaban, -3%). Se recupera del registro al reiniciar.
cooldown_minutes = 1440
# Si otra wallet seguida entró en el mismo token en estos minutos, el aviso lo dice.
confluence_minutes = 60
# Wallets seguidas distintas que tienen que haber comprado el token dentro de
# confluence_minutes para avisar. 1 = avisar de cada compra. Las compras que
# no llegan quedan en el registro con enviada = 0.
min_wallets = 1
# Minutos sin volver a avisar de un token ya avisado por wallets: las compras
# siguientes quedan en el registro con enviada = 0, salvo que se sumen
# realert_new_wallets wallets más que en el último aviso (sale como
# actualización; 0 = no reavisar nunca: que entren más wallets no lo hacía
# mejor). token_cooldown_minutes = 0 = sin límite por token.
token_cooldown_minutes = 0
realert_new_wallets = 2
# Una wallet que compra más tokens distintos que esto en una hora (un bot o un
# degen que entra en todo) no avisa ni cuenta para la confluencia y, con
# blacklist, va a la lista negra. 0 = sin tope.
max_tokens_per_hour = 0
# Una wallet con más transacciones que esto en una hora es un bot (los de
# trading hacen cientos por minuto): con blacklist va a la lista negra
# antes de leerlas, porque cada una cuesta una consulta al RPC. 0 = sin tope.
max_txs_per_hour = 300
# Una wallet sin ninguna transacción en estos días está abandonada: con
# blacklist va a la lista negra durante otros tantos días, y al acabar se
# comprueba si volvió a operar (si no, vuelve a entrar). 0 = no hacerlo.
max_inactive_days = 30
# Lista negra, en la tabla lista_negra de [radar].alert_log_path: sus wallets
# se quitan de `file` y no se vuelven a seguir. Las entradas con `hasta` son
# temporales: la wallet se deja de consultar hasta esa fecha, pero sigue en
# `file`. Un blacklist_file de versiones anteriores se pasa a la base al
# arrancar y se renombra a .importado.
blacklist = false
# Una wallet con una compra que cae este % en el seguimiento (rug) entra sola
# en la lista negra. 0 = no hacerlo.
rug_drop_pct = 90
# Lista negra automática por resultados: una wallet con al menos
# loser_min_signals tokens medidos cuya mediana a loser_checkpoint_minutes
# es loser_max_median_ret_pct o peor entra sola en la lista negra (requiere
# blacklist). 0 = no hacerlo.
loser_min_signals = 5
loser_max_median_ret_pct = -50
# Checkpoint del registro con el que se mide: 5, 15, 30, 60, 240 o 1440 min.
# A 30 min casi todas las compras parecían buenas y se hundían horas o días
# después; a 24 h se ve.
loser_checkpoint_minutes = 1440
# Hora local (0-23) a la que llega cada día por Telegram el ranking de las
# wallets seguidas por la mediana de sus tokens a 1 h, 4 h y 24 h, para ver
# cuáles sobran. -1 = no mandarlo. 2026-10-24: ordenando
# las wallets por su mediana hasta el 19-oct, el mejor tercio dio después +3%
# a 1 h y el peor -9% (Spearman +0.76); el historial predice.
ranking_hour = 9
# Aciertos de la wallet en el aviso: de la primera compra de cada token,
# cuántas llegaron a +hit_pct sin haber caído antes más de hit_max_drop_pct
# (el objetivo y el stop de quien copia la compra). Se miran todas las
# muestras del seguimiento en orden; una que no llegó a ninguno de los dos
# cuenta como fallo a las 24 h. 2026-11-07: antes bastaba con tocar +8% en
# algún momento, aunque antes hubiera caído; de 2558 tokens, 789 tocaron +8%
# y -15% en la misma primera media hora sin que se supiera qué fue antes.
# Solo cuentan las compras registradas desde entonces.
hit_pct = 8
hit_max_drop_pct = 15
# Advertencia ⚠️ de volumen de bots en el aviso (no descarta nada): con al
# menos bot_volume_min_txns_m5 transacciones en 5 min y menos de
# bot_volume_max_usd_per_tx USD de media por transacción, o compras a menos
# de bot_volume_buy_margin_pct puntos del 50%. 0 = sin advertencia.
# 2026-11-07: HELL avisó con 254 tx por $275 en 5 min y 49,6% de compras; en
# 20 min hubo 1098 tx y la única compra de más de 0,1 SOL fue la de la wallet
# avisada. Cayó -12% a 30 min. Como filtro quitaría 16 de 694 avisos, que
# daban -1% de mediana a 1 h, -2% a 4 h y -10% a 24 h (los que quedaban, +1%,
# -1% y -8%): pocos casos y poca diferencia para descartarlos.
bot_volume_min_txns_m5 = 50
bot_volume_max_usd_per_tx = 5
bot_volume_buy_margin_pct = 2
# Filtros del par para avisar de una compra de wallet (0 = sin filtro). Con
# los primeros datos, los pares de menos de 2 h daban una mediana de -67% a
# 30 min, los que ya subían más de 50% en 1h -25% y los de market cap por
# debajo de 100k -21%. Lo descartado queda en el registro con su motivo.
# También se les aplican [dexscreener].dex_ids y quote_tokens.
min_pair_age_minutes = 120
max_price_change_h1_pct = 50
min_market_cap_usd = 100000
# Lo que ya subió en los últimos 5 min (0 = sin filtro). A diferencia de los
# anteriores se aplica también en bonding curve:
# comprar en plena vela es llegar tarde. 2026-10-24: las que entraban con
# +20% o más en 5 min daban -33% de media a 24 h (+10% o menos, -8%).
max_price_change_m5_pct = 20
# Actividad mínima del par (0 = sin filtro): transacciones (compras + ventas)
# en los últimos 5 min y volumen en USD de la última hora. Los tokens muertos
# (una o dos transacciones en los últimos minutos) no se mueven: el aviso no
# hace perder, pero tampoco sirve.
# 2026-11-01: con la edad y el turnover ya filtrados sobraban. Con 4 txns y
# $3.000 quitaban 6,8 avisos/día de los últimos 10 días (casi la mitad), que
# daban +2% de mediana a 1 h y -1% a 24 h (los que quedaban, +2% y -5%) y caían
# más de 50% a 24 h el 5% (los que quedaban, 13%). Ojo: son tokens de poca
# liquidez (mediana $21k), donde la propia compra mueve el precio.
min_txns_m5 = 0
min_volume_h1_usd = 0
# Volumen de la última hora sobre el market cap (0.05 = 5%). Con mucho más
# volumen del que corresponde al tamaño del token lo están bombeando o ya
# están saliendo: por encima del 5%, el 64% de las señales caía más de 50% en
# días; por debajo, el 28%. Con pares de más de un día, hasta el 10% salía
# igual o mejor. 0 = sin filtro.
max_turnover_h1 = 0.1
# Avisar también de las compras de tokens en bonding curve (pump.fun antes de
# graduarse...), marcadas con 🧪. Solo se les aplican quote_tokens,
# max_price_change_h1_pct, max_price_change_m5_pct, min_txns_m5 y min_volume_h1_usd, y no cuentan para
# la lista negra por rug ni por resultados. Son mucho más arriesgadas.
bonding_curve = false
# Avisos de actividad por el WebSocket del RPC (logsSubscribe): solo se leen
# las transacciones que avisa (sin las transferencias simples), en vez de
# consultar todas las wallets en cada vuelta. Si se cae, se vuelve a
# consultar todas hasta que reconecta.
websocket = true
# Vacío = el de [solana].rpc_url cambiando https:// por wss://.
ws_url = ""
# Con el WebSocket, cada cuánto se consultan todas por si se perdió un aviso.
full_poll_minutes = 10

[telegram]
# token del bot y chat_id del usuario o canal que debe recibir las alertas.
# Usa @userinfobot de tg para obtener el ChatID
bot_token = "TU_BOT_TOKEN_AQUI"
chat_id = "TU_CHAT_ID_AQUI"
# Opcional: solo si quieres mandar las alertas a un tema (topic) concreto
# dentro de un grupo con "Temas" activados. Omite esta línea si no aplica.
# message_thread_id = 123
